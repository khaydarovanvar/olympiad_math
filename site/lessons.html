<script>
(function () {
  var lang = window.MLLESSON.lang();
  window.MLLESSON.mountSwitch(lang);
  document.documentElement.lang = lang;

  var T = {
    ru: { home:'Главная', lessons:'Уроки', library:'Библиотека', topics:'Темы',
          eyebrow:'Уроки',
          title:'Шестнадцать тем, разобранных по-настоящему',
          lede:'Каждый урок — это полная теория с доказательствами, разобранные примеры и задачи с олимпиад: от разминки до уровня IMO. Русский и английский, одна кнопка.',
          soon:'Скоро', open:'Открыть урок', res:'Ресурсы',
          probs:['задача','задачи','задач'], secs:['раздел','раздела','разделов'] },
    en: { home:'Home', lessons:'Lessons', library:'Library', topics:'Topics',
          eyebrow:'Lessons',
          title:'Sixteen topics, taught properly',
          lede:'Every lesson is the full theory with proofs, worked examples, and problems from real olympiads — from a warm-up to IMO level. Russian and English, one button.',
          soon:'Soon', open:'Open the lesson', res:'Resources',
          probs:['problem','problems'], secs:['section','sections'] }
  }[lang];

  function plural(n, forms) {
    if (lang !== 'ru') return n + ' ' + forms[n === 1 ? 0 : 1];
    var a = n % 10, b = n % 100;
    var f = (a === 1 && b !== 11) ? 0 : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 1 : 2;
    return n + ' ' + forms[f];
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  document.title = T.lessons + ' — MathLab';
  document.getElementById('eyebrow').textContent = T.eyebrow;
  document.getElementById('lxTitle').textContent = T.title;
  document.getElementById('lxLede').textContent = T.lede;
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
    el.textContent = T[el.getAttribute('data-t')] || el.textContent;
  });

  var have = {};
  (window.LESSON_INDEX || []).forEach(function (e) { have[e.n] = e; });

  document.getElementById('lxMarquee').innerHTML = TOPICS.map(function (t) {
    return esc(have[t.n] ? (have[t.n].title[lang] || t.title) : t.title);
  }).join(' <em>✦</em> ') + ' <em>✦</em> ';

  document.getElementById('lxGrid').innerHTML = TOPICS.map(function (t, i) {
    var L = have[t.n];
    var title = L ? (L.title[lang] || t.title) : t.title;
    var href = L ? ('lesson.html?t=' + t.n + '&lang=' + lang) : ('topic.html?t=' + t.n);
    return '<a class="tcard lx-card' + (L ? '' : ' soon') + '" data-cat="' + t.catKey +
      '" data-reveal data-reveal-delay="' + (i % 4) + '" href="' + href + '">' +
      '<span class="tnum">' + (t.n < 10 ? '0' : '') + t.n + '</span>' +
      '<h3>' + esc(title) + '</h3>' +
      '<p>' + esc(L && L.sub ? (L.sub[lang] || t.tip) : t.tip) + '</p>' +
      '<span class="tfoot">' +
        (L ? '<span class="lx-stat"><span>' + esc(plural(L.sections, T.secs)) + '</span>' +
             '<span>' + esc(plural(L.problems, T.probs)) + '</span></span>'
           : '<span class="tcat">' + esc(T.soon) + '</span>') +
      '<span class="tgo">' + esc(L ? T.open : T.res) + ' →</span></span></a>';
  }).join('');
})();
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
